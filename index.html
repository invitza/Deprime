.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(110px);opacity:.36;animation:fl 26s ease-in-out infinite alternate;scale:calc(1 + var(--bass,0)*.18);transition:background-color .8s}

else if(view=='lib'){const ts=sortL(tracks);h=`<h1>Медиатека</h1><div class="bar2">${addBtn}<select id="srt"><option value="at"${S.sort=='at'?' selected':''}>По дате добавления</option><option value="title"${S.sort=='title'?' selected':''}>По названию</option><option value="artist"${S.sort=='artist'?' selected':''}>По исполнителю</option></select><small>${tracks.length} в библиотеке</small></div>${tracks.length?rows(ts):'<p class="empty">Библиотека пуста. Добавьте MP3 с устройства.</p>'}`}
else if(view=='lists'){if(openL){const l=lists.find(x=>x.id==openL);if(!l){openL=null;return render()}const ts=l.ids.map(byId).filter(Boolean);
h=`<div class="bar2"><button class="ib glass" data-a="back">${ic('back')}</button><div class="tx"><h2>${esc(l.name)}</h2><small>${esc(l.desc||'')} · треков: ${ts.length}</small></div></div><div class="bar2"><button class="btn pri" data-a="playall">${ic('play')} Слушать</button><button class="btn" data-a="shufall">Вперемешку</button><button class="btn" data-a="pledit">Изменить</button><button class="btn" data-a="pldup">Дублировать</button><button class="btn" data-a="plpin">${l.pin?'Открепить':'Закрепить'}</button><button class="btn" data-a="pldel">Удалить</button></div>${ts.length?rows(ts,true):'<p class="empty">Плейлист пуст. Добавьте треки кнопкой «+».</p>'}`}
else h=`<h1>Плейлисты</h1><div class="grid"><div class="card glass new" data-a="newlist">${ic('plus')}<b>Новый плейлист</b></div>${[...lists].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)).map(lcard).join('')}</div>`}
else{h=`<h1>Поиск</h1><input id="q" class="in" placeholder="Трек, исполнитель, плейлист или ссылка Spotify" value="${esc(q)}" autocomplete="off"><div id="spr"></div><div id="sr"></div>`}
$('#main').innerHTML=h;$('#main').classList.toggle('stag',anim);anim=false;if(view=='search')srRender()}
function srRender(){const s=q.trim(),m=s.match(SPR);if(m)spCard(m);else if($('#spr'))$('#spr').innerHTML='';
const k=s.toLowerCase(),ts=k?tracks.filter(t=>(t.title+' '+t.artist).toLowerCase().includes(k)):[],ls=k?lists.filter(l=>l.name.toLowerCase().includes(k)):[];
$('#sr').innerHTML=s&&!m?`<h3>Треки</h3>${rows(ts)}<h3>Плейлисты</h3>${ls.length?`<div class="grid">${ls.map(lcard).join('')}</div>`:'<p class="empty">Плейлисты не найдены</p>'}`:(m?'':'<p class="empty">Ищите по своей библиотеке или вставьте ссылку на трек, альбом или плейлист Spotify.</p>')}

/* ===== диалоги ===== */
const D=h=>{$('#dlg').innerHTML=`<div class="ov"><div class="box glass">${h}</div></div>`};
const closeD=()=>{tapLines=null;$('#dlg').innerHTML=''};
const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)};
const conf=(msg,cb,label)=>{okcb=cb;D(`<h3>${msg}</h3><div class="btns"><button class="btn" data-a="dc">Отмена</button><button class="btn pri" data-a="ok">${label||'Да'}</button></div>`)};
const plD=l=>D(`<h3>${l?'Плейлист':'Новый плейлист'}</h3><input id="pn" class="in" placeholder="Название" value="${esc(l?l.name:'')}" maxlength="60"><input id="pd" class="in" placeholder="Описание" value="${esc(l?l.desc||'':'')}" maxlength="140"><div class="btns"><button class="btn" data-a="dc">Отмена</button><button class="btn pri" data-a="plsave" data-id="${l?l.id:''}" data-t="">Сохранить</button></div>`);
const acD=()=>D(`<div class="acc"><span class="lg big"></span><div><b>${esc(S.name)}</b><br><small>Локальный профиль на этом устройстве</small></div></div><label class="fl">Имя<input id="nm" class="in" value="${esc(S.name)}" maxlength="30"></label><p><small>Вход через Google или e-mail и синхронизация между устройствами требуют сервера (Supabase или Firebase) и пока не подключены. Кнопок-пустышек здесь нет.</small></p><button class="chip${S.autoLy===false?'':' on'}" data-a="autoly">Искать тексты автоматически</button><p><small>Название и исполнитель трека отправляются в открытую базу текстов LRCLIB. Нужен интернет.</small></p><div class="btns"><button class="btn" data-a="themes">Оформление</button><button class="btn" data-a="sl">Таймер сна</button><button class="btn" data-a="clh">Очистить историю</button><button class="btn pri" data-a="nmok">Сохранить</button></div>`);
const themeD=()=>D(`<h3>Оформление</h3>${Object.entries(TH).map(([k,t])=>`<button class="th${S.theme==k?' on':''}" data-a="thset" data-t="${k}"><i style="background:linear-gradient(115deg,${t[1]} 25%,${t[2]},${t[3]})"></i>${t[0]}</button>`).join('')}<button class="th${S.theme=='custom'?' on':''}" data-a="thc"><i style="background:conic-gradient(${S.custom.bg},${S.custom.a},${S.custom.b},${S.custom.fg},${S.custom.bg})"></i>Своя тема…</button><div class="btns"><button class="btn pri" data-a="dc">Готово</button></div>`);
const customD=()=>D(`<h3>Своя тема</h3>${[['bg','Фон'],['a','Основной цвет'],['b','Акцентный цвет'],['fg','Цвет текста']].map(([k,n])=>`<label class="fl">${n}<input type="color" data-c="${k}" class="in" style="height:44px;padding:4px" value="${S.custom[k]}"></label>`).join('')}<div class="btns"><button class="btn" data-a="themes">Назад</button><button class="btn pri" data-a="dc">Готово</button></div>`);
function showQueue(){D(`<h3>Очередь</h3><div class="ql">${queue.length?queue.map((id,i)=>{const t=byId(id);return t?`<div class="row${i==qi?' cur':''}" data-a="qj" data-i="${i}"><div class="cv sm" style="${cov(t)}"></div><div class="tx"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div>${i!=qi?`<button class="ib sm" data-a="qx" data-i="${i}">${ic('x')}</button>`:''}</div>`:''}).join(''):'<p class="empty">Очередь пуста. Запустите любой трек.</p>'}</div><div class="btns"><button class="btn" data-a="dc">Закрыть</button></div>`)}
function addToD(id){D(`<h3>Добавить в плейлист</h3><div class="ql">${lists.map(l=>`<div class="row" data-a="pick" data-id="${id}" data-l="${l.id}"><div class="tx"><b>${esc(l.name)}</b><small>Треков: ${l.ids.length}</small></div></div>`).join('')}<div class="row" data-a="pnew" data-id="${id}"><div class="tx"><b>+ Новый плейлист</b></div></div></div><div class="btns"><button class="btn" data-a="dc">Отмена</button></div>`)}
const moreD=id=>{const t=byId(id);if(!t)return;D(`<h3>${esc(t.title)}</h3><div class="btns" style="justify-content:stretch;flex-direction:column"><button class="btn" data-a="tedit" data-id="${id}">Изменить название и исполнителя</button>${t.kind!='sp'?`<button class="btn" data-a="cvset" data-id="${id}">Обложка</button><button class="btn" data-a="lyset" data-id="${id}">Текст песни</button>`:''}<button class="btn" data-a="tdel" data-id="${id}">Удалить из библиотеки</button></div><p><small>Оригинальный файл на устройстве не удаляется.</small></p><div class="btns"><button class="btn" data-a="dc">Закрыть</button></div>`)};
function addIds(tid,lid){const l=lists.find(x=>x.id==lid);if(!l)return;if(l.ids.includes(tid))return toast('Трек уже в плейлисте');l.ids.push(tid);put('lists',l);toast(`Добавлено в «${l.name}»`);render()}
function delTrack(id){const t=byId(id);if(!t)return;tracks=tracks.filter(x=>x!=t);rm('tracks',id);lists.forEach(l=>{if(l.ids.includes(id)){l.ids=l.ids.filter(x=>x!=id);put('lists',l)}});S.hist=S.hist.filter(x=>x!=id);
const was=cur&&cur.id;queue=queue.filter(x=>x!=id);if(cur==t){audio.pause();audio.removeAttribute('src');cur=null;queue=[];qi=-1;S.last=null;drawBar()}else qi=queue.indexOf(was);
if(t.url)URL.revokeObjectURL(t.url);save();toast('Удалено из библиотеки');render()}
const LL=()=>lists.find(x=>x.id==openL);
const seg=(ts,i)=>{const L=ts.filter(x=>x.kind!='sp');return[L,L.indexOf(ts[i])]};

/* ===== действия ===== */
document.addEventListener('click',e=>{if(e.target.classList.contains('ov'))return closeD();
const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id,i=+el.dataset.i;
switch(a){
case'nav':view=el.dataset.v;openL=null;q='';anim=true;render();break;
case'acct':acD();break;case'nmok':{const v=$('#nm').value.trim();if(v){S.name=v;save();render()}closeD();break}
case'themes':themeD();break;case'thset':S.theme=el.dataset.t;save();applyTheme();themeD();break;case'thc':customD();break;
case'sl':slD();break;case'slq':startSl(+el.dataset.m);break;case'slf':S.fade=+el.dataset.m;save();slD();break;
case'sls':{let m=+$('#slm').value;const t=$('#slt').value;if(!m&&t){const[h,mi]=t.split(':').map(Number),n=new Date(),d=new Date();d.setHours(h,mi,0,0);if(d<=n)d.setDate(d.getDate()+1);m=Math.max(1,Math.round((d-n)/6e4))}if(m>0)startSl(m);else toast('Укажите время');break}
case'sl10':if(S.sl){S.sl.end+=6e5;save();updSl()}break;case'slx':S.sl=null;save();fade=1;applyVol();slD();break;
case'clh':S.hist=[];save();toast('История очищена');render();break;
case'play':{const t=shown[i];if(!t)break;if(t.kind=='sp'){window.open(t.url,'_blank','noopener');break}const[L,j]=seg(shown,i);playFrom(L,j);break}
case'pc':{const L=loc(),j=L.findIndex(t=>t.id==id);if(j>=0)playFrom(L,j);break}
case'cont':{const t=byId(S.last.id),L=loc();queue=L.map(x=>x.id);qi=queue.indexOf(t.id);load(t,true);audio.currentTime=S.last.t;break}
case'pp':audio.paused?(graph(),audio.play()):audio.pause();break;
case'next':next();break;case'prev':prev();break;
case'shuf':shuf=!shuf;drawBar();drawNP();break;
case'rep':repeat=(repeat+1)%3;audio.loop=repeat==2;drawNP();break;
case'np':$('#np').classList.add('open');break;case'npc':$('#np').classList.remove('open');break;
case'vc':lyr=false;drawNP();break;case'vl':lyr=true;lastLi=-9;drawNP();break;
case'queue':showQueue();break;case'qj':qi=i;load(byId(queue[qi]),true);closeD();break;case'qx':queue.splice(i,1);if(i<qi)qi--;showQueue();break;
case'fav':{const t=byId(id);if(t){t.fav=!t.fav;put('tracks',rec(t));drawNP();render()}break}
case'addto':addToD(id);break;case'pick':addIds(id,el.dataset.l);closeD();break;
case'pnew':plD(null);$('#dlg .btn.pri').dataset.t=id;break;
case'more':moreD(id);break;
case'tedit':{const t=byId(id);D(`<h3>Данные трека</h3><input id="te" class="in" value="${esc(t.title)}"><input id="ta" class="in" placeholder="Исполнитель" value="${esc(t.artist||'')}"><div class="btns"><button class="btn" data-a="dc">Отмена</button><button class="btn pri" data-a="tsave" data-id="${id}">Сохранить</button></div>`);break}
case'tsave':{const t=byId(id),v=$('#te').value.trim();if(t&&v){t.title=v;t.artist=$('#ta').value.trim();put('tracks',rec(t));closeD();meta();drawBar();drawNP();render()}break}
case'cvset':{const t=byId(id)||cur;D(`<h3>Обложка</h3><div class="btns"><label class="btn pri">Выбрать картинку<input type="file" id="cvf" data-id="${t.id}" accept="image/*" hidden></label>${t.cover?`<button class="btn" data-a="cvdel" data-id="${t.id}">Убрать</button>`:''}<button class="btn" data-a="dc">Закрыть</button></div>`);break}
case'cvdel':{const t=byId(id);if(t){t.cover=null;if(t.curl)URL.revokeObjectURL(t.curl);t.curl='';put('tracks',rec(t));closeD();meta();drawBar();drawNP();render()}break}
case'lyset':case'lyedit':D('');lyD();break;
case'lysave':{if(cur){cur.lrc=$('#lt').value;cur.L=parseL(cur.lrc);put('tracks',rec(cur))}closeD();lastLi=-9;drawNP();break}
case'ly':if(audio.duration){audio.currentTime=Math.max(0,+el.dataset.t+(cur.off||0));audio.play()}break;
case'fs+':case'fs-':S.fs=Math.min(48,Math.max(16,S.fs+(a=='fs+'?3:-3)));save();lastLi=-9;drawNP();break;
case'of+':case'of-':cur.off=Math.round(((cur.off||0)+(a=='of+'?.5:-.5))*10)/10;put('tracks',rec(cur));lastLi=-9;drawNP();break;
case'fo':fo=!fo;try{if(fo&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else if(!fo&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}drawNP();break;
case'tdel':conf('Удалить из библиотеки?',()=>delTrack(id),'Удалить');break;
case'newlist':plD(null);break;
case'plsave':{const n=$('#pn').value.trim();if(!n)break;const d=$('#pd').value.trim();if(id){const l=lists.find(x=>x.id==id);l.name=n;l.desc=d;put('lists',l)}else{const l={id:uid(),name:n,desc:d,ids:el.dataset.t?[el.dataset.t]:[],pin:false,at:Date.now()};lists.push(l);put('lists',l);toast(`Плейлист «${n}» создан`)}closeD();render();break}
case'open':openL=id;anim=true;render();break;case'back':openL=null;anim=true;render();break;
case'playall':case'shufall':{const l=LL(),ts=l?l.ids.map(byId).filter(t=>t&&t.kind!='sp'):[];if(!ts.length){toast('В плейлисте нет локальных треков');break}if(a=='shufall')shuf=true;playFrom(ts,shuf?Math.random()*ts.length|0:0);break}
case'pledit':plD(LL());break;
case'pldup':{const l=LL(),c={...l,id:uid(),name:l.name+' (копия)',ids:[...l.ids],pin:false};lists.push(c);put('lists',c);toast('Плейлист продублирован');break}
case'plpin':{const l=LL();l.pin=!l.pin;put('lists',l);render();break}
case'pldel':conf(`Удалить плейлист «${esc(LL().name)}»? Треки останутся в библиотеке.`,()=>{const l=LL();rm('lists',l.id);lists=lists.filter(x=>x!=l);openL=null;render()},'Удалить');break;
case'mvu':case'mvd':{const l=LL(),k=l.ids.indexOf(id),j=a=='mvu'?k-1:k+1;if(j>=0&&j<l.ids.length){[l.ids[k],l.ids[j]]=[l.ids[j],l.ids[k]];put('lists',l);render()}break}
case'rmfrom':{const l=LL();l.ids=l.ids.filter(x=>x!=id);put('lists',l);render();break}
case'spadd':{const u=el.dataset.u,m=spMeta[u]||{},t={id:uid(),kind:'sp',title:m.title||'Spotify · '+SPT[el.dataset.ty],artist:'Spotify',url:u,thumb:m.thumb||'',dur:0,at:Date.now()};hyd(t);tracks.push(t);put('tracks',rec(t));addToD(t.id);break}
case'ok':{const f=okcb;closeD();if(f)f();break}
case'lyfind':if(cur){closeD();findLy(cur,true)}break;
case'autoly':S.autoLy=S.autoLy===false;save();acD();break;
case'lyauto':{const ls=plainL($('#lt').value);if(!ls.length||!audio.duration){toast('Нужен текст и загруженный трек');break}const d=audio.duration,t0=Math.min(8,d*.06),t1=d*.96,tot=ls.reduce((a,x)=>a+x.length+8,0);let acc=0;cur.lrc=ls.map(x=>{const r=ltag(t0+acc/tot*(t1-t0))+x;acc+=x.length+8;return r}).join('\n');cur.L=parseL(cur.lrc);put('tracks',rec(cur));closeD();lyr=true;drawNP();toast('Тайминг примерный. Для точности используйте «Тапами»');break}
case'lytap':{const ls=plainL($('#lt').value);if(!ls.length){toast('Сначала вставьте текст');break}tapLines=ls;tapSt=[];audio.currentTime=0;audio.play();tapD();break}
case'tap':tapNow();break;
case'tapundo':if(tapSt.length){tapSt.pop();tapD()}break;
case'tapx':closeD();break;
case'dc':closeD();break}});
document.addEventListener('input',e=>{const t=e.target;
if(t.id=='vol'){S.vol=t.value/100;applyVol();save();t.style.setProperty('--p',t.value+'%')}
else if(t.classList.contains('seek')){if(audio.duration)audio.currentTime=t.value/1000*audio.duration;t.style.setProperty('--p',t.value/10+'%')}
else if(t.id=='q'){q=t.value;srRender()}
else if(t.dataset.c){S.custom[t.dataset.c]=t.value;S.theme='custom';save();applyTheme()}});
document.addEventListener('change',async e=>{const t=e.target;
if(t.id=='srt'){S.sort=t.value;save();render()}
else if(t.id=='f'){const fs=[...t.files];t.value='';addFiles(fs)}
else if(t.id=='lf'){const f=t.files[0];if(f&&cur){$('#lt').value=await f.text()}}
else if(t.id=='cvf'){const f=t.files[0],tr=byId(t.dataset.id);if(f&&tr){const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const k=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>{if(!b)return;if(tr.curl&&tr.cover)URL.revokeObjectURL(tr.curl);tr.cover=b;tr.curl=URL.createObjectURL(b);put('tracks',rec(tr));closeD();meta();drawBar();drawNP();render();toast('Обложка обновлена')},'image/jpeg',.88)};img.onerror=()=>toast('Не удалось открыть картинку');img.src=u}}});
document.addEventListener('pointerdown',e=>{if(e.target.classList&&e.target.classList.contains('seek'))drag=true});
document.addEventListener('pointerup',()=>{drag=false});
document.addEventListener('keydown',e=>{const t=e.target,ty=t.tagName;
if(tapLines&&(e.key==' '||e.key=='Enter')){e.preventDefault();tapNow()}
else if(e.key==' '&&cur&&ty!='INPUT'&&ty!='TEXTAREA'&&ty!='BUTTON'){e.preventDefault();audio.paused?audio.play():audio.pause()}
else if(e.key=='ArrowRight'&&cur&&ty!='INPUT'&&ty!='TEXTAREA'){audio.currentTime+=5}
else if(e.key=='ArrowLeft'&&cur&&ty!='INPUT'&&ty!='TEXTAREA'){audio.currentTime-=5}
else if(e.key=='Escape'){closeD();$('#np').classList.remove('open')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();addFiles([...e.dataTransfer.files])});

/* ===== визуализация звука (реальный сигнал) ===== */
function loop(){requestAnimationFrame(loop);const els=[$('.bg'),$('#np'),$('header')];
if(!an||audio.paused){if(lb){lb=0;els.forEach(x=>x.style.setProperty('--bass',0))}return}
an.getByteFrequencyData(data);let b=0;for(let i=0;i<6;i++)b+=data[i];b=Math.pow(b/6/255,2.2);
if(Math.abs(b-lb)>.01){lb=b;els.forEach(x=>x.style.setProperty('--bass',b.toFixed(2)))}
const c=$('#viz');if(!c)return;const x=c.getContext('2d'),w=c.width,h=c.height,n=32,bw=w/n;x.clearRect(0,0,w,h);
const g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,TC[0]);g.addColorStop(1,TC[1]);x.fillStyle=g;
for(let i=0;i<n;i++){const bh=Math.max(3,data[i*2+1]/255*h);x.fillRect(i*bw+2,h-bh,bw-4,bh)}}

/* ===== запуск ===== */
(async()=>{applyTheme();
$('#nav').innerHTML=NAV.map(([v,n,i])=>`<button data-a="nav" data-v="${v}">${ic(i)}<span>${n}</span></button>`).join('');
$('#hsl').innerHTML=ic('moon');$('#hth').innerHTML=ic('pal');
db=await idb();tracks=(await all('tracks')).sort((a,b)=>a.at-b.at).map(hyd);lists=await all('lists');
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(S.sl&&S.sl.end<=Date.now())S.sl=null;
if(S.last){const t=byId(S.last.id);if(t&&t.url){const L=loc();queue=L.map(x=>x.id);qi=queue.indexOf(t.id);load(t,false);audio.addEventListener('loadedmetadata',()=>{audio.currentTime=S.last.t},{once:true})}}
render();loop()})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('PWA offline setup:', err)));
}
</script>
